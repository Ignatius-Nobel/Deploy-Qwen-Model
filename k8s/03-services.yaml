apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chatbot
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5001
      targetPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chatbot
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080