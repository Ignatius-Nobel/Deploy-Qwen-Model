<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qwen Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 16px;
    }

    header { text-align: center; margin-bottom: 20px; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #a78bfa; }
    header p  { color: #64748b; font-size: 0.85rem; margin-top: 4px; }

    .chat-wrap {
      width: 100%;
      max-width: 720px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 4px 2px 12px;
    }

    .bubble-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }
    .bubble-row.user  { flex-direction: row-reverse; }
    .bubble-row.bot   { flex-direction: row; }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .avatar.user { background: #6c63ff; color: #fff; }
    .avatar.bot  { background: #1e2130; color: #a78bfa; border: 1px solid #2d3148; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 14px;
      font-size: 0.92rem;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble.user {
      background: #6c63ff;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .bubble.bot {
      background: #1e2130;
      border: 1px solid #2d3148;
      color: #e2e8f0;
      border-bottom-left-radius: 4px;
    }
    .bubble.error {
      background: #2d1515;
      border: 1px solid #7f1d1d;
      color: #fca5a5;
    }

    .typing {
      display: flex;
      gap: 4px;
      padding: 12px 14px;
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 14px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing span {
      width: 6px; height: 6px;
      background: #6c63ff;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40%            { transform: translateY(-6px); }
    }

    .pod-tag {
      font-size: 0.7rem;
      color: #475569;
      margin-top: 3px;
      padding-left: 38px;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    textarea {
      flex: 1;
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 10px;
      color: #e2e8f0;
      font-size: 0.92rem;
      padding: 10px 14px;
      resize: none;
      min-height: 44px;
      max-height: 120px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    textarea:focus { border-color: #6c63ff; }

    button {
      background: #6c63ff;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.92rem;
      font-weight: 600;
      padding: 0 20px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
      align-self: flex-end;
      height: 44px;
    }
    button:hover:not(:disabled) { background: #7c73ff; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
  </style>
</head>
<body>

<header>
  <h1>Qwen Chatbot</h1>
  <p>Powered by Qwen2.5-0.5B-Instruct · running offline in Kubernetes</p>
</header>

<div class="chat-wrap">
  <div id="messages"></div>

  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="sendBtn" onclick="send()">Send</button>
  </div>
</div>

<script>
  const msgsEl  = document.getElementById("messages");
  const inputEl = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");

  function addBubble(role, text, pod) {
    const row = document.createElement("div");
    row.className = `bubble-row ${role}`;

    const av = document.createElement("div");
    av.className = `avatar ${role}`;
    av.textContent = role === "user" ? "You" : "AI";

    const bub = document.createElement("div");
    bub.className = `bubble ${role}`;
    bub.textContent = text;

    row.append(av, bub);
    msgsEl.appendChild(row);

    if (pod) {
      const tag = document.createElement("div");
      tag.className = "pod-tag";
      tag.textContent = `pod: ${pod}`;
      msgsEl.appendChild(tag);
    }

    msgsEl.scrollTop = msgsEl.scrollHeight;
    return bub;
  }

  function addTyping() {
    const row = document.createElement("div");
    row.className = "bubble-row bot";
    row.id = "typing-row";

    const av = document.createElement("div");
    av.className = "avatar bot";
    av.textContent = "AI";

    const dots = document.createElement("div");
    dots.className = "typing";
    dots.innerHTML = "<span></span><span></span><span></span>";

    row.append(av, dots);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function removeTyping() {
    document.getElementById("typing-row")?.remove();
  }

  async function send() {
    const msg = inputEl.value.trim();
    if (!msg || sendBtn.disabled) return;

    inputEl.value = "";
    inputEl.style.height = "auto";
    addBubble("user", msg);

    sendBtn.disabled = true;
    addTyping();

    try {
      const res  = await fetch("/chat", {
        method:  "POST",
        headers: { "Content-Type": "application/json" },
        body:    JSON.stringify({ message: msg }),
      });
      const data = await res.json();
      removeTyping();

      if (data.error) {
        const bub = addBubble("bot", data.error);
        bub.classList.add("error");
      } else {
        addBubble("bot", data.reply, data.pod);
      }
    } catch (err) {
      removeTyping();
      const bub = addBubble("bot", "Network error — " + err.message);
      bub.classList.add("error");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  // Auto-resize textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  // Enter sends, Shift+Enter inserts newline
  inputEl.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
</script>

</body>
</html>
