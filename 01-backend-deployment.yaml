apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatbot
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: chatbot-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: MODEL_ID
              value: "Qwen/Qwen2.5-0.5B-Instruct"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: HF_HOME
              value: "/app/hf_cache"
            - name: NUM_THREADS
              value: "4"
          resources:
            requests:
              memory: "1.5Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 3